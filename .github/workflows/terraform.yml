name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

  TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}

  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Configure Terraform provider mirror
        shell: bash
        working-directory: .
        run: |
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url     = "https://terraform-mirror.yandexcloud.net/"
              include = ["registry.terraform.io/*/*"]
            }

            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

      - name: Configure Yandex Cloud credentials
        shell: bash
        working-directory: .
        run: |
          printf '%s' "$YC_SA_KEY_JSON" > "$RUNNER_TEMP/yc-key.json"
          chmod 600 "$RUNNER_TEMP/yc-key.json"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$RUNNER_TEMP/yc-key.json" >> "$GITHUB_ENV"

      - name: Configure SSH public key
        shell: bash
        working-directory: .
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ vars.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub
          chmod 600 ~/.ssh/id_ed25519.pub

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan